plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
}

paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()

group = 'com.oolongho'
version = 'alpha-0.1.0'

java {
    // Java 21 + 1.21.x dev bundle：单 jar 兼容 Paper/Folia/Spigot 1.21+~26.1+
    // 通过运行时 NmsAdapter 选择实现，编译期统一用 1.21.x bundle（含 PositionMoveRotation/Avatar 反射可见性等）
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    mavenCentral()
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    // VaultAPI（经济接口，软依赖）
    maven { url = 'https://jitpack.io' }
    // CraftEngine 仓库（https://repo.momirealms.net/releases/）与 Gradle Apache HttpClient 5 的 TLS 握手不兼容
    // （JDK 原生 SSLSocket 与 PowerShell .NET 均可正常握手，仅 Gradle HTTP client 失败），
    // 故 CE 编译期 jar 改为本地 libs/ 引入。升级 Gradle 或 CE 仓库修复后可切回 maven 坐标。
}

dependencies {
    paperweight.paperDevBundle('1.21.11-R0.1-SNAPSHOT')
    // CraftEngine（自定义方块 API，运行期硬依赖）—— 本地 libs，规避 Gradle HTTP client TLS 问题
    compileOnly fileTree(dir: 'libs', include: ['craft-engine-*.jar'])
    // VaultAPI 传递 org.bukkit:bukkit 与 paper-api 的 bukkit capability 冲突，需排除
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
    compileOnly 'me.clip:placeholderapi:2.11.6'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def projectVersion = version
def projectJavaVersion = java.sourceCompatibility

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand 'project': [version: projectVersion]
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'WooSimMarket'

    manifest {
        attributes(
            'Built-By': 'Gradle',
            'Build-Jdk': System.getProperty('java.version'),
            'Created-By': 'WooSimMarket Build System'
        )
    }
}

tasks.register('buildInfo') {
    doLast {
        println "=========================================="
        println "WooSimMarket Build Information"
        println "=========================================="
        println "Version: ${projectVersion}"
        println "Java: ${projectJavaVersion}"
        println "Paper/Folia/Spigot: 1.21+ (single jar, api-version 1.21)"
        println "=========================================="
    }
}

build.dependsOn buildInfo
