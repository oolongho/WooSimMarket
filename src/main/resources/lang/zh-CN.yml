# WooSimMarket 中文语言文件

# 消息前缀（命令反馈消息体通过 {prefix} 占位符引用）
prefix: "<white>[</white><color:#5EEAD4>WooSimMarket</color><white>]</white> "

# 通用
no-permission: "{prefix}<color:#EF4444>你没有权限执行此操作。</color>"
player-only: "{prefix}<color:#EF4444>该命令只能由玩家执行。</color>"
config-reloaded: "{prefix}<color:#10B981>配置已重载。</color>"

# 商店
shop-created: "{prefix}<color:#10B981>商店已创建。</color>"
shop-limit-reached: "{prefix}<color:#EF4444>已达商店数量上限，无法再创建。</color>"
shop-too-close: "{prefix}<color:#EF4444>距离其他收银机太近，无法创建。</color>"
shop-not-found: "{prefix}<color:#EF4444>未找到商店。</color>"
shop-default-name: "{owner} 的小店"
shop-rename-prompt: "{prefix}<color:#F59E0B>请在聊天栏输入新店名（输入 cancel 取消）：</color>"
shop-rename-cancelled: "{prefix}<color:#9CA3AF>改名已取消。</color>"
shop-rename-success: "{prefix}<color:#10B981>店名已更新为 {name}。</color>"
shop-rename-invalid: "{prefix}<color:#EF4444>店名无效（长度需 1-20）。</color>"

# 货架
shelf-bound: "{prefix}<color:#10B981>货架已绑定到商店，请打开货架管理界面启用。</color>"
shelf-too-far: "{prefix}<color:#EF4444>货架距离收银机太远，无法绑定。</color>"
shelf-not-found: "{prefix}<color:#EF4444>未找到货架。</color>"
shelf-disabled: "{prefix}<color:#F59E0B>该货架已禁用。</color>"

# 可视化
range-not-found: "{prefix}<color:#EF4444>附近未找到你的商店。</color>"
range-showing: "{prefix}<color:#10B981>已显示商店范围，持续 {seconds} 秒。</color>"

# 定价
price-set: "{prefix}<color:#10B981>价格已设置为 {price}。</color>"
price-input-prompt: "{prefix}<color:#F59E0B>请在聊天栏输入价格（输入 cancel 取消）：</color>"
price-input-invalid: "{prefix}<color:#EF4444>无效的价格输入，请输入正数。</color>"
price-input-cancelled: "{prefix}<color:#9CA3AF>定价已取消。</color>"

# 提现
withdraw-success: "{prefix}<color:#10B981>已提现 {amount} 到你的账户。</color>"
withdraw-failed: "{prefix}<color:#EF4444>提现失败，请稍后重试。</color>"
withdraw-no-balance: "{prefix}<color:#F59E0B>商店余额为 0，无可提现。</color>"

# NPC（被动通知，不带 {prefix}）
npc-stuck: "<color:#9CA3AF>NPC 卡住已销毁。</color>"
npc-purchased: "<color:#10B981>{npc} 购买了 {item}，单价 {price}。</color>"

# NPC 性格前缀（MiniMessage 格式，统一抹茶绿 #a3b547，含尾部空格分隔）
# normal 性格前缀默认留空（无前缀），用户可自定义（如 "<color:#a3b547>[顾客]</color> ")
personality-prefix-normal: ""
personality-prefix-generous: "<color:#a3b547>[慷慨]</color> "
personality-prefix-stingy: "<color:#a3b547>[吝啬]</color> "
personality-prefix-trend-follower: "<color:#a3b547>[跟风]</color> "
personality-prefix-independent: "<color:#a3b547>[独立]</color> "
personality-prefix-impatient: "<color:#a3b547>[急躁]</color> "
personality-prefix-patient: "<color:#a3b547>[耐心]</color> "
personality-prefix-rich: "<color:#a3b547>[富裕]</color> "
personality-prefix-poor: "<color:#a3b547>[贫穷]</color> "
personality-prefix-homebody: "<color:#a3b547>[宅]</color> "
personality-prefix-all-weather: "<color:#a3b547>[全天候]</color> "
personality-prefix-early-bird: "<color:#a3b547>[早鸟]</color> "
personality-prefix-night-owl: "<color:#a3b547>[夜猫]</color> "

# GUI 标题与按钮（GUI 标题非聊天消息，不带 {prefix}）
gui-shelf-title: "货架管理"
gui-shelf-set-price: "<color:#F59E0B>点击设定价格</color>"
gui-shelf-current-price: "<color:#F59E0B>当前价格: {price}</color>"
gui-shelf-enabled: "<color:#10B981>已启用</color>"
gui-shelf-disabled: "<color:#EF4444>已禁用</color>"
gui-shelf-toggle-lore: "<color:#9CA3AF>点击切换状态</color>"
gui-shelf-bound: "<color:#10B981>已绑定物品</color>"
gui-shelf-unbound: "<color:#9CA3AF>未绑定物品</color>"
gui-shop-title: "商店面板"
gui-shop-info-lore: "<gray>点击更改店名</gray>"
gui-shop-withdraw: "<color:#10B981>点击提现</color>"
gui-shop-price-table: "<color:#5EEAD4>标准价表</color>"
gui-shop-price-table-lore: "<gray>点击查看标准价表</gray>"
gui-shop-balance: "<color:#F59E0B>当前余额: {balance}</color>"

# 商店统计面板
gui-stats-title: "商店统计"
gui-stats-back: "<white>返回</white>"
gui-stats-back-lore: "<gray>返回商店面板</gray>"
gui-stats-total-attempts: "<yellow>总判定次数</yellow>"
gui-stats-bought: "<yellow>成交数</yellow>"
gui-stats-rejected: "<yellow>拒绝数</yellow>"
gui-stats-rate: "<yellow>购买率</yellow>"
gui-stats-revenue: "<yellow>总收入</yellow>"
gui-stats-avg-price: "<yellow>平均成交价</yellow>"
gui-stats-window: "<yellow>统计窗口</yellow>"
gui-stats-window-lore: "<gray>基于近期 {limit} 条记录</gray>"
gui-stats-refresh: "<yellow>刷新</yellow>"
gui-stats-empty: "<gray>暂无交易记录</gray>"
gui-shop-stats: "<color:#5EEAD4>统计面板</color>"
gui-shop-stats-lore: "<gray>点击查看交易统计</gray>"
gui-stats-total-attempts-lore: "<white>{value}</white>"
gui-stats-bought-lore: "<white>{value}</white>"
gui-stats-rejected-lore: "<white>{value}</white>"
gui-stats-rate-lore: "<white>{value}%</white>"
gui-stats-revenue-lore: "<white>{value}</white>"
gui-stats-avg-price-lore: "<white>{value}</white>"
gui-stats-item-attempts: "<gray>判定: <white>{value}</white></gray>"
gui-stats-item-bought: "<gray>成交: <white>{value}</white></gray>"
gui-stats-item-revenue: "<gray>收入: <white>{value}</white></gray>"

# 标准价表面板
gui-price-table-title: "标准价表"
gui-price-table-back: "<white>返回</white>"
gui-price-table-back-lore: "<gray>返回商店面板</gray>"
gui-price-table-prev: "<white>上一页</white>"
gui-price-table-next: "<white>下一页</white>"
gui-price-table-page: "<white>{current}/{total}</white>"
gui-price-table-item-lore: "<gray>标准价 </gray><color:#F59E0B>{price}</color>"

# 命令
command-help: "{prefix}<color:#5EEAD4><bold>WooSimMarket 命令</bold></color>"
command-give-success: "{prefix}<color:#10B981>已将 {item} 给予 {player}。</color>"
command-info: "{prefix}<color:#9CA3AF>商店信息：ID={id} 余额={balance}</color>"
command-list: "{prefix}<color:#9CA3AF>{player} 的商店列表：{shops}</color>"

# NPC 头顶思考展示（子系统 4，13 性格 × 4 阶段 = 52 条，flow-mapping 风格）
# 阶段键：enter（进入徘徊）/ hesitate（未命中余量）/ buy（命中）/ give-up（耗尽）
thought-display:
  normal:         { enter: "<i><gray>思考中…</gray></i>", hesitate: "<i><gray>犹豫不决…</gray></i>", buy: "<green>决定购买！</green>", give-up: "<gray>算了，不买了</gray>" }
  generous:       { enter: "<i><gray>看着不错…</gray></i>", hesitate: "<i><gray>再瞅瞅…</gray></i>", buy: "<green>这个价很值！</green>", give-up: "<gray>下次再说吧</gray>" }
  stingy:         { enter: "<i><gray>盘算着价格…</gray></i>", hesitate: "<i><gray>还是太贵…</gray></i>", buy: "<green>勉强能接受！</green>", give-up: "<gray>太贵了，走人</gray>" }
  trend-follower: { enter: "<i><gray>大家都在买…</gray></i>", hesitate: "<i><gray>跟不跟呢…</gray></i>", buy: "<green>跟上潮流！</green>", give-up: "<gray>不跟了，走</gray>" }
  independent:    { enter: "<i><gray>独立想想…</gray></i>", hesitate: "<i><gray>不被左右…</gray></i>", buy: "<green>自己决定了！</green>", give-up: "<gray>不必从众</gray>" }
  impatient:      { enter: "<i><gray>买不买呢…</gray></i>", hesitate: "<i><gray>快点决定…</gray></i>", buy: "<green>就它了！</green>", give-up: "<gray>不磨蹭了，走</gray>" }
  patient:        { enter: "<i><gray>仔细想想…</gray></i>", hesitate: "<i><gray>再考虑考虑…</gray></i>", buy: "<green>想清楚了，买！</green>", give-up: "<gray>时机未到，走吧</gray>" }
  rich:           { enter: "<i><gray>随便看看…</gray></i>", hesitate: "<i><gray>钱不是问题…</gray></i>", buy: "<green>直接拿下！</green>", give-up: "<gray>没看上，走</gray>" }
  poor:           { enter: "<i><gray>摸摸口袋…</gray></i>", hesitate: "<i><gray>够不够钱…</gray></i>", buy: "<green>刚好够，买！</green>", give-up: "<gray>买不起，走</gray>" }
  homebody:       { enter: "<i><gray>天气怎么样…</gray></i>", hesitate: "<i><gray>不太想出门…</gray></i>", buy: "<green>今天可以！</green>", give-up: "<gray>天气不好，回去</gray>" }
  all-weather:    { enter: "<i><gray>风雨无阻…</gray></i>", hesitate: "<i><gray>继续看看…</gray></i>", buy: "<green>随时可买！</green>", give-up: "<gray>不想要了</gray>" }
  early-bird:     { enter: "<i><gray>趁早看看…</gray></i>", hesitate: "<i><gray>还来得及…</gray></i>", buy: "<green>早买早享受！</green>", give-up: "<gray>晚点再来</gray>" }
  night-owl:      { enter: "<i><gray>夜里逛逛…</gray></i>", hesitate: "<i><gray>夜深了…</gray></i>", buy: "<green>夜购正合意！</green>", give-up: "<gray>天快亮了，走</gray>" }

# Debug 后缀（isDebug=true 时追加到 ENTER/HESITATE 文本末尾）
thought-debug-suffix: " <dark_gray>[P={p} {done}/{total}]</dark_gray>"
