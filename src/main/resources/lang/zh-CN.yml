# WooSimMarket 中文语言文件

# 消息前缀（命令反馈消息体通过 {prefix} 占位符引用）
prefix: "<white>[</white><color:#5EEAD4>WooSimMarket</color><white>]</white> "

# 通用
no-permission: "{prefix}<color:#EF4444>你没有权限执行此操作。</color>"
player-only: "{prefix}<color:#EF4444>该命令只能由玩家执行。</color>"
config-reloaded: "{prefix}<color:#10B981>配置已重载。</color>"

# 商店
shop-created: "{prefix}<color:#10B981>商店已创建。</color>"
shop-limit-reached: "{prefix}<color:#EF4444>已达商店数量上限，无法再创建。</color>"
shop-too-close: "{prefix}<color:#EF4444>距离其他收银机太近，无法创建。</color>"
shop-not-found: "{prefix}<color:#EF4444>未找到商店。</color>"

# 货架
shelf-bound: "{prefix}<color:#10B981>货架已绑定到商店，请打开货架管理界面启用。</color>"
shelf-too-far: "{prefix}<color:#EF4444>货架距离收银机太远，无法绑定。</color>"
shelf-not-found: "{prefix}<color:#EF4444>未找到货架。</color>"
shelf-disabled: "{prefix}<color:#F59E0B>该货架已禁用。</color>"

# 可视化
range-not-found: "{prefix}<color:#EF4444>附近未找到你的商店。</color>"
range-showing: "{prefix}<color:#10B981>已显示商店范围，持续 {seconds} 秒。</color>"

# 定价
price-set: "{prefix}<color:#10B981>价格已设置为 {price}。</color>"
price-input-prompt: "{prefix}<color:#F59E0B>请在聊天栏输入价格（输入 cancel 取消）：</color>"
price-input-invalid: "{prefix}<color:#EF4444>无效的价格输入，请输入正数。</color>"
price-input-cancelled: "{prefix}<color:#9CA3AF>定价已取消。</color>"

# 提现
withdraw-success: "{prefix}<color:#10B981>已提现 {amount} 到你的账户。</color>"
withdraw-failed: "{prefix}<color:#EF4444>提现失败，请稍后重试。</color>"
withdraw-no-balance: "{prefix}<color:#F59E0B>商店余额为 0，无可提现。</color>"

# NPC（被动通知，不带 {prefix}）
npc-stuck: "<color:#9CA3AF>NPC 卡住已销毁。</color>"
npc-purchased: "<color:#10B981>{npc} 购买了 {item}，单价 {price}。</color>"

# GUI 标题与按钮（GUI 标题非聊天消息，不带 {prefix}）
gui-shelf-title: "<color:#5EEAD4><bold>货架管理</bold></color>"
gui-shelf-set-price: "<color:#F59E0B>点击设定价格</color>"
gui-shelf-current-price: "<color:#F59E0B>当前价格: {price}</color>"
gui-shelf-enabled: "<color:#10B981>已启用</color>"
gui-shelf-disabled: "<color:#EF4444>已禁用</color>"
gui-shelf-toggle-lore: "<color:#9CA3AF>点击切换状态</color>"
gui-shop-title: "<color:#5EEAD4><bold>商店面板</bold></color>"
gui-shop-info: "<color:#5EEAD4>商店信息</color>"
gui-shop-withdraw: "<color:#10B981>点击提现</color>"
gui-shop-refresh: "<color:#9CA3AF>点击刷新</color>"
gui-shop-balance: "<color:#F59E0B>当前余额: {balance}</color>"

# 命令
command-help: "{prefix}<color:#5EEAD4><bold>WooSimMarket 命令</bold></color>"
command-give-success: "{prefix}<color:#10B981>已将 {item} 给予 {player}。</color>"
command-info: "{prefix}<color:#9CA3AF>商店信息：ID={id} 余额={balance}</color>"
command-list: "{prefix}<color:#9CA3AF>{player} 的商店列表：{shops}</color>"
