shop-notify-off: "{prefix}<color:#9CA3AF>Purchase notifications disabled.</color>"
shop-shelf-all-enabled: "{prefix}<color:#10B981>All shelves enabled.</color>"
shop-shelf-all-disabled: "{prefix}<color:#EF4444>All shelves disabled.</color>"
