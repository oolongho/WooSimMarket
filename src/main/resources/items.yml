# WooSimMarket 标准价表
# 每个条目定义物品的标准价格与可选价格敏感度：
#   standard-price:    标准价（NPC 购买判定的基准价）
#   price-sensitivity: 物品价格敏感度（价格因子的指数基准，默认用 market.yml 全局值）

items:
  DIAMOND:
    standard-price: 100.0
    # 稀有物品，但可量产，价格敏感度稍微低于全局（提价影响更小）
    price-sensitivity: 1.8
  IRON_INGOT:
    standard-price: 2.0
    # 常见物品：铁锭因为刷铁机的存在，设置价格敏感度更高
    price-sensitivity: 4
  BREAD:
    standard-price: 5.0
  GOLDEN_APPLE:
    standard-price: 200.0
    # 稀有物品，且一般不会卖，价格敏感度低于全局（提价影响更小）
    price-sensitivity: 1.2
