# WooSimMarket 标准价表
# 每个条目定义物品的标准价格与可选价格敏感度：
#   standard-price:    标准价（NPC 购买判定的基准价）
#   price-sensitivity: 物品价格敏感度（价格因子的指数基准，省略则用 market.yml 全局值）
#
# 价格敏感度参考：
#   < 1.0：刚需/慷慨（食物、基础材料）—— 即使涨价也买
#   = 1.0：标准理性
#   > 1.0：挑剔/吝啬（奢侈品、可量产）—— 稍微涨价就不买
# 全局默认 sensitivity: 2.0（见 market.yml），多数物品省略此项继承全局

items:
  # ===== 矿物与矿石 =====
  DIAMOND:
    standard-price: 500.0
    price-sensitivity: 1.0  # 稀有但可量产，反应适中
  EMERALD:
    standard-price: 400.0
  NETHERITE_INGOT:
    standard-price: 2000.0
    price-sensitivity: 1.5  # 极稀有，玩家惜售
  GOLD_INGOT:
