# ===== WooSimMarket NPC 性格配置 =====
#
# 本文件定义 NPC 性格数据。每个 NPC spawn 时按 weight 加权随机分配一种性格，
# 性格的 6 个数值维度在后续判别式、多次判定、思考展示中作为权重系数。
#
# 【6 个数值维度】
#   price-sensitivity   价格敏感度倍率（≥0，倍率 × 全局/物品级 sensitivity）
#                       高=对价格更敏感，低=对价格不敏感
#   market-sensitivity  供需敏感度倍率（≥0，倍率 × 全局/物品级 market-sensitivity）
#                       高=跟风购买（热销品更想买），低=独立判断
#   impatience          冲动度（[0,1]，0=极慢决策，1=极快决策）
#                       后续子系统 3 用于决定判定次数与间隔
#   budget              预算倍率（≥0，最多花 budget × standardPrice）
#                       超过此硬上限则购买概率=0
#   weather-sensitivity 天气敏感度（[0,1]，0=不受影响，1=坏天气完全不买）
#   time-preference     时间偏好（[0,1]，0=夜型，1=日型，0.5=中性）
#
# 【weight 字段】
#   spawn 时按 weight / totalWeight 概率分配。weight 是相对值，
#   weight ≤0 的性格被跳过不参与随机。
#
# 【非法值处理】
#   - impatience / weather-sensitivity / time-preference 超出 [0,1] → 钳制到区间
#   - price-sensitivity / market-sensitivity / budget 为负 → 钳制到 0
#   - 维度缺失 → 使用默认值（不阻塞加载）
#
# 【创建新性格】
#   在 personalities 节点下新增 key，配置 weight + 6 维度即可：
#
#   bargain-hunter:
#     weight: 8
#     price-sensitivity: 2.5
#     market-sensitivity: 1.2
#     impatience: 0.3
#     budget: 2.0
#     weather-sensitivity: 0.4
#     time-preference: 0.5
#
#   并在 lang/zh-CN.yml 和 en-US.yml 添加 personality-prefix-bargain-hunter 条目
#   （MiniMessage 格式，统一抹茶绿 #a3b547，含尾部空格）。
#   normal 性格无前缀，新增的极端性格应配置前缀。

personalities:
  # 中性性格：所有维度取默认值，无前缀，spawn 概率最高（兜底）
  normal:
    weight: 50
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5

  # === price-sensitivity 维度 ===
  generous: # [慷慨] 对价格不敏感，提价也愿意买
    weight: 5
    price-sensitivity: 0.4
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5
  stingy: # [吝啬] 对价格高度敏感，提价大幅降低购买概率
    weight: 5
    price-sensitivity: 2.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5

  # === market-sensitivity 维度 ===
  trend-follower: # [跟风] 热销品更想买
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.8
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5
  independent: # [独立] 不受供需影响，独立判断
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 0.3
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5

  # === impatience 维度 ===
  impatient: # [急躁] 决策快（后续子系统 3：少次快决）
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.95
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5
  patient: # [耐心] 决策慢（后续子系统 3：多次慢决）
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.1
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.5

  # === budget 维度 ===
  rich: # [富裕] 预算高，可买贵物
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 6.0
    weather-sensitivity: 0.3
    time-preference: 0.5
  poor: # [贫穷] 预算低，只能买便宜货
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 1.2
    weather-sensitivity: 0.3
    time-preference: 0.5

  # === weather-sensitivity 维度 ===
  homebody: # [宅] 坏天气完全不买
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.9
    time-preference: 0.5
  all-weather: # [全天候] 天气不影响
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.0
    time-preference: 0.5

  # === time-preference 维度 ===
  early-bird: # [早鸟] 日型，白天购买意愿高
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 1.0
  night-owl: # [夜猫] 夜型，夜晚购买意愿高
    weight: 5
    price-sensitivity: 1.0
    market-sensitivity: 1.0
    impatience: 0.5
    budget: 3.0
    weather-sensitivity: 0.3
    time-preference: 0.0
