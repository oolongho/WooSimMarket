# WooSimMarket 配置文件
# 完整参数说明见 .trae/specs/init-woosimmarket/spec.md

settings:
  # 调试模式：开启后输出详细日志（NPC 生成、购买判定、市场调价等）
  debug: false
  # 语言文件（对应 lang/<language>.yml），可选 zh-CN / en-US
  language: zh-CN

shop:
  # 收银机绑定货架的半径（方块），货架必须在此半径内才可绑定
  bind-radius: 16
  # 每个玩家可拥有的商店上限
  limit: 1
  # 两个收银机之间的最小距离（方块），防止商店互相覆盖
  min-distance: 8

npc:
  # NPC 刷新间隔区间（秒），实际间隔在 [min, max] 内随机
  spawn-interval-min: 30
  spawn-interval-max: 60
  # 每个商店同时存在的 NPC 上限
  max-concurrent: 3
  # 卡住判定：连续 N 秒位移不足 threshold-distance 则销毁
  stuck-threshold-seconds: 15
  stuck-threshold-distance: 5.0
  # NPC 离店销毁距离（方块）
  despawn-distance: 32
  # NPC 到达货架的判定距离（方块）
  target-reach-distance: 1.5

market:
  # 购买概率敏感度：P = (Base / UserPrice) ^ sensitivity × global-multiplier
  sensitivity: 2.0
  # 供需倍率钳制区间
  multiplier-min: 0.1
  multiplier-max: 5.0
  # 倍率指数：FinalBase = StandardPrice × Multiplier ^ exponent
  multiplier-exponent: 0.8
  # 时间桶数量（72 桶 × 5 分钟 = 6 小时滑动窗口）
  bucket-count: 72
  bucket-minutes: 5
  # 全局购买倍率（管理员手动调节整体热度）
  global-multiplier: 1.0

skin:
  # NPC 皮肤来源玩家名列表（Ashcon API 按名获取 skin）
  names: [Notch, jeb_]
  # 皮肤缓存文件（落盘到 plugins/WooSimMarket/<file>）
  cache-file: skins.json
  # 异步获取皮肤的超时时间（秒）
  fetch-timeout-seconds: 10
  # 获取失败时的兜底皮肤（STEVE / ALEX）
  fallback: STEVE

database:
  # SQLite 数据库文件名（位于 plugins/WooSimMarket/ 下）
  file: woosimmarket.db
