# WooSimMarket 全局设置

settings:
  # 调试日志细分开关
  debug:
    # 购买判定：P 值计算、各因子（budget/price/weather/time/market/global-multiplier）、roll 结果
    purchase: false
    # 寻路：请求/结果/迭代数/区块快照
    pathfinding: false
    # 其他：NPC 生成/销毁/皮肤/市场动量/思考文本
    general: false
  # 语言文件（lang/<language>.yml），zh-CN / en-US
  language: zh-CN

database:
  # SQLite 数据库文件路径
  file: data/woosimmarket.db

# 商店统计（purchase_log 保留与查询）
stats:
  # 交易记录保留天数（超过则清理，每日执行一次清理任务）
  retention-days: 7
  # 统计面板单次查询记录上限
  query-limit: 100
