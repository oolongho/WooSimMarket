# ===== WooSimMarket 市场经济配置 =====
#
# 本文件控制 NPC 购买概率计算参数。
# 物品级覆盖见 items.yml（per-item price-sensitivity）。
#
# 【购买概率公式】（实现在 market/PurchaseFormula.java，单次 roll）
#   ① budget 硬门：userPrice > personality.budget × standardPrice → P=0
#   ② priceFactor = (standardPrice / userPrice) ^ effectiveSensitivity
#        effectiveSensitivity = getItemPriceSensitivity × personality.priceSensitivity
#   ③ weatherFactor = 1 − weatherSensitivity × (hasStorm ? 1 : 0)
#   ④ timeFactor    = 1 + time-strength × (timePreference − 0.5) × 2 × (dayNess − 0.5)
#        dayNess = (cos(2π × (time − 6000) / 24000) + 1) / 2   // 正午=1 半夜=0
#   ⑤ marketFactor = 1 + momentum-strength × (momentum − 0.5) × 2 × market-sensitivity
#        momentum = MarketManager.getPurchaseMomentum(itemId)  // EMA∈[0,1], 默认0.5
#   ⑥ P = clamp[0,1]( priceFactor × weatherFactor × timeFactor × marketFactor × global-multiplier )
#
#   - standardPrice / price-sensitivity：见 items.yml 与下方市场参数
#   - personality 5 维度参与 P（impatience 用于子系统 3，market-sensitivity 参与动量因子⑤）
#   - 不钳制单个因子，仅钳制最终 P（允许低价/日间加成 >1 后相乘收敛）

market:
  # 价格敏感度（P 公式指数，>1 提价显著降概率）
  sensitivity: 2.0
  # 全局购买意愿缩放（P 公式最终乘数）。<1 让公平价也产生犹豫：
  #   0.6 → 公平价 P≈0.6（犹豫），8折 P≈0.94（倾向买），半价 P=1.0（必买）
  #   1.0 → 公平价 P=1.0（必买，无犹豫）
  global-multiplier: 0.6
  # 时间因子幅度（0=全局禁用时间影响；1.0=默认）
  # dayNess 正午=1 半夜=0；timePreference 0=夜型 1=日型 0.5=中性（中性时 timeFactor恒=1）
  time-strength: 1.0
  # 购买动量强度（marketFactor 幅度，0=禁用动量）
  # trend-follower(1.8) 在热销品(momentum=1.0)上 +54%，冷门品(momentum=0.0) 上 -54%
  # independent(0.3) 仅 ±5%，几乎不受影响。推荐 [0, 0.5]
  momentum-strength: 0.3
