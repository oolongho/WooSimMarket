# WooSimMarket 市场经济配置
#
# NPC 购买概率 P 公式
#
# 总式：P = clamp[0,1]( 全局意愿 × 价格因子 × 天气因子 × 时间因子 × 市场因子 )
#
# 预算（门槛，非乘性因子）
#   售价 > 性格预算 × 有效标准价（standardPrice × priceDrift） → P=0（直接拒绝）
#   例：normal 性格（budget=2.0），有效标准价=2.0 → 最高接受 2.0×2.0=4.0
#
# 价格因子（公平价=1.0）
#   effectiveSensitivity = 物品价格敏感度 × 性格价格敏感度
#   价格因子 = (有效标准价 / 售价) ^ effectiveSensitivity
#   例：有效标准价=2.0，售价=1.6（8 折），effectiveSensitivity=5 → (2/1.6)^5=2.44（打折加成）
#   售价<标准价（打折）→ >1 | 售价=标准价 → 1 | 售价>标准价（加价）→ <1
#
# 天气因子（好天气=1.0）
#   天气因子 = 1 - 性格天气敏感度 × (是否暴雨 ? 1 : 0)
#   例：normal 性格（weather-sensitivity=0.3），暴雨 → 1 - 0.3×1=0.7（减弱）
#
# 时间因子（中性偏好=1.0）
#   dayNess = (cos(2π × (时间-6000)/24000) + 1) / 2 （正午=1，半夜=0）
#   时间因子 = 1 + 时间因子幅度 × (性格时间偏好-0.5) × 2 × (dayNess-0.5)
#   例：early-bird 性格（time-preference=1.0），正午 → 1 + 1.0×0.5×2×0.5=1.5（日间加成）
#
# 市场因子（中性动量=1.0）
#   市场因子 = 1 + 市场因子幅度 × (动量-0.5) × 2 × 性格市场敏感度
#   动量 = MarketManager.getPurchaseMomentum(itemId)  // EMA∈[0,1]，默认 0.5
#   例：trend-follower 性格（market-sensitivity=1.8），动量=1.0 → 1 + 0.3×0.5×2×1.8=1.54（热销加成）
#
# 全局意愿（标准情景下控制基础犹豫度）
#   所有概率的最终缩放系数，0.5 → 标准情景（公平价/好天气/中性时间/中性动量）P=0.5（50%犹豫）
#
# 标准价/物品价格敏感度见 items.yml；性格维度见 npc.yml

market:
  # 全局意愿（所有概率的最终缩放系数，标准情景下 P=0.5 即 50% 犹豫）
  global-multiplier: 0.5
  # 全局价格敏感度（价格因子的指数基准，>1 提价显著降概率）
  sensitivity: 2.0
  # 时间因子幅度（0=全局禁用时间影响；默认 1.0）
  time-strength: 1.0
  # 市场因子幅度（0=禁用市场动量影响；默认 0.3，推荐 [0, 0.5]）
  # trend-follower[跟风]性格（market-sensitivity=1.8）在热销品（动量=1.0）上 +54%，冷门品（动量=0.0）上 -54%
  # independent[独立]性格（market-sensitivity=0.3）仅 ±5%，几乎不受影响
  momentum-strength: 0.3

  # 动态标准价漂移：标准价根据近期成交价中位数与购买率缓慢漂移，模拟市场均衡价
  # 每日异步执行 1 次（复用 cleanupTask 时段，主线程 0 影响），重启从 purchase_log 重算
  # 性能影响：每日 1 次异步任务，单次耗时 <50ms（4 物品 × 查询近 7 天日志 + 排序中位数）
  # 内存影响：每物品 1 个 double（可忽略）
  # 防刷机制：中位数抗离群 + 日幅度上限 + 均值回归 + 购买率负反馈（高价挂单反向下漂）
  drift:
    # 是否启用（关闭时 effectiveStandardPrice ≡ standardPrice，完全向后兼容）
    enabled: true
    # 统计窗口天数（仅用近 N 天 purchase_log；自动兜底不超过 stats.retention-days）
    window-days: 7
    # 价格偏离权重（近期成交价中位数相对有效标准价的偏离敏感度）
    price-weight: 0.5
    # 购买率权重（购买率偏离 0.5 的幅度，正=供不应求涨价，负=供过于求降价）
    supply-weight: 0.3
    # 均值回归强度（每日将 drift 向 1.0 拉回的比例，防长期失控）
    mean-reversion: 0.1
    # 日幅度上限（±0.05=每日最多漂移 5%）
    daily-cap: 0.05
    # drift 下限（0.5=标准价最低腰斩）
    min-factor: 0.5
    # drift 上限（2.0=标准价最高翻倍）
    max-factor: 2.0

# 商店配置
shop:
  # 收银机绑定货架的半径，货架必须在此半径内才可绑定
  bind-radius: 16
  # 每个玩家可拥有的商店上限
  limit: 1
  # 两个收银机之间的最小距离，防止商店互相覆盖
  min-distance: 8
  # 收银台方块
  # CE的namespace:path，或原版Material名
  # 留空默认 EMERALD_BLOCK
  cash-register-block: simmarket:cash_register
  # 货架方块
  # 留空默认 CHISELED_BOOKSHELF
  shelf-block: simmarket:shelf

# 货架全息展示
shelf-display:
  enabled: true
  # Y 偏移（1.0 = 方块顶部）
  item-offset-y: 1.2

# 收银台全息展示（店主头颅 + 店名文字）
shop-display:
  # 是否启用
  enabled: true
  # 店主头颅 Y 偏移（相对收银台方块底面，1.5 = 方块顶部上方 0.5 格）
  head-y-offset: 1.8
  # 店名文字 Y 偏移（在头颅下方，1.2 = 方块顶部上方 0.2 格）
  name-y-offset: 1.2
  # 店名文字颜色
  text-color: "#a3b547"

# 商店范围粒子持续秒数
range-duration-seconds: 10
